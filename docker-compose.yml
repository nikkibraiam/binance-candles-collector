services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bot-trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PASS_DATABASE:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bot-trading"]
      interval: 5s
      retries: 10

  collector:
    build: .
    command: ["--interval", "${COLLECT_INTERVAL:-1h}"]
    environment:
      BINANCE_URL: https://fapi.binance.com
      HOST_DATABASE: db
      USER_DATABASE: postgres
      PASS_DATABASE: ${PASS_DATABASE:-postgres}
      NAME_DATABASE: bot-trading
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
